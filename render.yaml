# render.yaml — Infrastructure as Code для Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → выбери репозиторий → Apply
# Postgres И Redis создаются автоматически этим blueprint —
# вручную ничего создавать не нужно (см. RENDER_DEPLOY.md).

services:

  # ── API (FastAPI + uvicorn + все background workers) ──────────────────────
  - type: web
    name: robot-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: starter          # $7/мес, 512 MB RAM — free засыпает, недопустимо
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health   # Render ждёт 200 здесь перед маршрутизацией

    # Alembic миграции запускаются до каждого деплоя.
    preDeployCommand: sh migrate.sh

    # Persistent disk — хранит trade_outcomes.jsonl между деплоями
    disk:
      name: ml-storage
      mountPath: /app/storage/ml
      sizeGB: 1

    envVars:
      - key: APP_ENV
        value: production
      - key: DB_AUTO_CREATE_SCHEMA
        value: "false"
      # Прод-домен дашборда для CORS
      - key: CORS_ORIGINS
        value: https://robot-web-ap8n.onrender.com
      - key: TRADE_OUTCOMES_PATH
        value: /app/storage/ml/trade_outcomes.jsonl
      - key: GRID_STATE_PATH
        value: /app/storage/ml/grid_state.json
      - key: NEWS_ENABLED
        value: "true"

      # ── Secrets (заполнить в Render Dashboard → Environment) ──────────────
      - key: JWT_SECRET
        sync: false
      - key: OWNER_API_TOKEN
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false

      # ── Database ───────────────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: robot-db
          property: connectionString

      # ── Redis ──────────────────────────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          name: robot-redis
          type: keyvalue
          property: connectionString

      # ── Telegram ──────────────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: finmt_bot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_API_URL
        value: https://robot-api-1rgi.onrender.com
      - key: TELEGRAM_OWNER_CHAT_ID
        sync: false
      - key: TELEGRAM_FREE_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_VIP_SIGNALS_CHAT_ID
        sync: false

      # ── HTX API ───────────────────────────────────────────────────────────
      - key: HTX_API_KEY
        sync: false
      - key: HTX_API_SECRET
        sync: false
      - key: HTX_API_HOSTNAME
        value: api-aws.huobi.pro
      - key: HTX_MARKET_TYPE
        value: spot
      - key: HTX_SYMBOLS
        value: BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT,AVAX/USDT,TRX/USDT,ADA/USDT

      # ── Trading mode ──────────────────────────────────────────────────────
      - key: ROBOT_MODE
        value: paper
      - key: TRADING_MODE
        value: paper_trade
      - key: ENABLE_LIVE_ORDERS
        value: "false"

      # ── Рынок исполнения ──────────────────────────────────────────────────
      - key: ENABLE_FUTURES_EXECUTION
        value: "true"
      - key: OB_MARKET_TYPE
        value: "swap"
      - key: ENABLE_SMART_LEVERAGE
        value: "false"
      # (#grade-axis-2026-09-04) Предохранитель сайзинга по грейду. Ось измерена
      # антипредсказательной: confidence предсказывает СТОП (AUC 0.66
      # [0.549; 0.772] на 97 сделках), грейд A значимо убыточен (−0.4257R), B у
      # нуля. Обе оси сайзинга дают A больше, чем B, поэтому включение любой из
      # них — ставка на проигрышное ведро. Пока false, включение роняет
      # production_blockers(). Переводится в true после ПЕРЕЗАМЕРА, не раньше.
      - key: GRADE_AXIS_VALIDATED
        value: "false"
      # (#confidence-ratchet-2026-09-04) true — уверенность = среднее двух ног
      # (рынок и чек-лист). false — прежний храповик max(base, setup×K), который
      # умел только повышать: расхождение ног поднимало уверенность, и ведро A
      # наполнялось сетапами, где рынок и чек-лист спорили. Правка меняет
      # ВЫБОРКУ входов и на старых данных не проверяется — переключатель здесь,
      # чтобы вернуть прежнее поведение без деплоя, если поток входов схлопнется.
      - key: CONFIDENCE_SYMMETRIC_BLEND
        value: "true"

      # (#entry-impulse-2026-09-04) Защёлка импульса входа. Кандидат — СОСТОЯНИЕ
      # (4h+1h, держится сутками), условия ТЗ — СОБЫТИЯ (разворот ADX, кросс
      # Stoch, один бар). Требуются одновременно, а происходят последовательно:
      # 68 отказов из 71 по adx_not_rising, медиана adx_delta −0.589.
      # shadow — считается и пишется, вход не меняется. enforce — живая защёлка
      # снимает ТОЛЬКО adx_not_rising и только когда он единственный блокер.
      # Переводить в enforce после замера live_and_sole_blocker в
      # /analytics/entry-gate-census, не раньше.
      # 05.09 вооружена: 46 блокировок из 67 имели живой импульс по ADX, у 13 из
      # них adx_rising был единственным блокером. Обратно в shadow — только
      # после замера когорты `adx_rising_latched` в stop-forensics.
      - key: ENTRY_IMPULSE_LATCH_MODE
        value: "enforce"
      - key: ENTRY_IMPULSE_TF
        value: "15m"
      - key: ENTRY_IMPULSE_WINDOW_SEC
        value: "1800"
      - key: ENTRY_IMPULSE_ADX_RISE_MIN
        value: "0"

      # (#scan-flap-2026-09-05) Сколько проход обязан молчать, прежде чем это
      # попадёт в ленту. Один тик без одобренных — норма: символ проходит отбор
      # сетапа и тут же блокируется своим гейтом, который пишет своё событие.
      # Без задержки лента набирала пару «замолчал → возобновил» каждые две
      # минуты — 19 системных записей за два часа, ни одна не отвечала на
      # вопрос «стоим мы или рынок ничего не даёт».
      - key: SCAN_SILENCE_MIN_SEC
        value: "300"

      # ── ДВИЖКИ (ВСЕ ВКЛЮЧЕНЫ) ─────────────────────────────────────────────
      - key: ENABLE_ORDERBOOK_ENGINE
        value: "true"
      - key: ENABLE_CRT_STRATEGY
        value: "true"       # ВКЛЮЧЕН
      - key: ENABLE_RANGE_STRATEGY
        value: "true"       # ВКЛЮЧЕН
      - key: ENABLE_SCALP_STRATEGY
        value: "true"       # ВКЛЮЧЕН
      - key: CORR_CLUSTER_ENABLED
        value: "true"
      - key: CORR_CLUSTER_PER_ENGINE
        value: "true"
      - key: CORR_CLUSTER_PORTFOLIO_MAX_SAME_DIR
        value: "5"
      - key: REENTRY_COOLDOWN_PER_ENGINE
        value: "true"
      
      # ML Mode
      - key: ML_MODE
        value: shadow
      - key: REGIME_EXP_SIZING_ENABLED
        value: "false"
      - key: DYNAMIC_MARGIN_FAIR_SHARE
        value: "false"
      - key: DYNAMIC_MARGIN_B_CAP_PCT_OF_FREE
        value: "1.0"

      # ── KAMA ──────────────────────────────────────────────────────────────
      - key: KAMA_ER_PERIOD
        value: "10"
      - key: KAMA_FAST
        value: "2"
      - key: KAMA_SLOW
        value: "30"

      # ── TREND ENGINE (Настройка на забор движения + защита от шума) ───────
      - key: TREND_TRIGGER_MODE
        value: enforce
      - key: TREND_MAX_EXTENSION_ATR
        value: "3.5"
      - key: TZ_ADX_MIN
        value: "15.0"
      - key: TZ_STOCH_ZONE
        value: "45.0"
      - key: TZ_MODE
        value: enforce
      # (#tz-enforce-adx-rising-2026-09-03) Добавлено adx_rising — беспороговое
      # семейство «ADX растёт» (отдельно от некалиброванного порога TZ_ADX_MIN,
      # который остаётся в тени). Вход в УЖЕ ЗАТУХАЮЩИЙ тренд был источником
      # всех крупных стопов 01–03.09: 11 сделок с провалом этого условия дали
      # −9.74 USDT, 4 без провала — +8.90.
      - key: TZ_ENFORCE_CONDITIONS
        value: kama,di,obv,adx_rising
      - key: TZ_ENFORCE_MIN_SAMPLE
        value: "0"

      # ── ANTI-CHOP: вход в молодой тренд (#anti-chop-young-trend-2026-09-03) ─
      # Веер EMA20↔EMA200 лагает после V-разворота и закрывает вход на весь
      # первый отрезок движения. Альтернативный путь пускает узкий веер, если
      # ADX выше минимума И растёт, а DI разведены по стороне сделки.
      # Выключается одним флагом без правки кода.
      - key: ANTI_CHOP_YOUNG_TREND_ENABLED
        value: "true"
      - key: ANTI_CHOP_YOUNG_ADX_MIN
        value: "20.0"
      - key: ANTI_CHOP_YOUNG_ADX_RISE_MIN
        value: "0.5"
      - key: ANTI_CHOP_YOUNG_DI_SPREAD_MIN
        value: "15.0"

      # ── Видимость и управление простоем цикла ─────────────────────────────
      # (#loop-skip-visibility-2026-09-04) Причина, по которой цикл не торгует,
      # теперь пишется в ленту решений, а не только в лог Render. Пульс задаёт,
      # как часто повторять её, пока причина держится: тик раз в ~66 с, и
      # запись каждый тик дала бы за 5.5-часовой простой ~320 одинаковых
      # событий в таблице, где их уже 58 тысяч.
      - key: LOOP_SKIP_HEARTBEAT_SEC
        value: "900"
      # (#switch-guard-blind-2026-09-04) Выключатель гейта переключения биржи.
      # В paper он и так самоустраняется, но у предохранителя, способного
      # остановить всю торговлю, выключатель обязан быть явным.
      - key: EXCHANGE_SWITCH_GUARD_ENABLED
        value: "true"
      - key: TZ_EXIT_CONDITIONS
        value: kama,adx
      - key: TZ_TREND_EXIT_ONLY
        value: "true"
      
      # Стопы и выходы (Увеличены буферы чтобы не выбивало шумом)
      - key: TZ_STOP_MIN_DIST_PCT
        value: "0.4"
      - key: TZ_DISASTER_STOP_PCT
        value: "5.0"
      - key: TZ_USE_DYNAMIC_ATR_STOPS
        value: "true"
      - key: TZ_STOP_MIN_DIST_ATR_MULT
        value: "3.0"       # Надежный стоп
      - key: TZ_EXIT_KAMA_BUFFER_ATR_MULT
        value: "2.0"       # Буфер выхода
      - key: TZ_STOP_LOSS_ATR_MULT
        value: "4.0"       # Глубокий стоп для удержания позиции
      - key: TZ_EXIT_ADX_FADE
        value: "2.0"       # Чувствительный выход при затухании
      - key: TZ_HARD_STOP_LOSS_PCT
        value: "3.0"
      
      # ── TP2 как ЭТАП, а не потолок (#progressive-tp2-2026-09-03) ──────────
      # Раньше достижение TP2 закрывало позицию целиком по цене ровно tp2:
      # правый хвост срезался конструктивно, а гейт входа tp2_reached_too_rarely
      # питался статистикой, которую этот же выход и цензурировал («TP2
      # превышен» ненаблюдаемо, если TP2 — выход). Теперь на TP2 фиксируется
      # доля остатка, хвост едет под трейлом с храповиком стопа.
      # Выключается одним флагом: TP2_PROGRESSIVE_ENABLED=false вернёт потолок.
      - key: TP2_PROGRESSIVE_ENABLED
        value: "true"
      - key: TP2_PARTIAL_CLOSE_SHARE
        value: "0.5"       # доля ОСТАТКА (после TP1 остаётся ~половина)
      - key: TP2_TRAIL_LEG_SHARE
        value: "0.5"       # ширина трейла = половина отрезка TP1→TP2
      - key: TP2_TRAIL_MIN_BUFFER_PCT
        value: "0.20"      # пол ширины трейла, % цены
      - key: TP2_TRAIL_GIVEBACK_SHARE
        value: "0.40"      # отдал 40% прироста СВЕРХ TP2 → фиксируем хвост

      # ── Защита прибыли в зоне TP1→TP2 (#post-tp1-dead-zone-2026-09-03) ────
      # Три существующие ветки требуют MFE ≥ 2–3% или стоп ≥ 3% при медианном
      # MFE наших режимов 0.52–1.19% — не могли взвестись ни разу, и после TP1
      # сделка имела ровно два исхода: TP2 или сползание на безубыток.
      - key: POST_TP1_TRAIL_ENABLED
        value: "true"
      - key: POST_TP1_TRAIL_MIN_MFE_PCT
        value: "0.60"
      - key: POST_TP1_TRAIL_GIVEBACK_SHARE
        value: "0.40"

      # Breakeven Lock (Фиксация прибыли)
      - key: BREAKEVEN_LOCK_ENABLED
        value: "true"
      - key: BREAKEVEN_LOCK_ARM_PCT
        value: "0.35"      # Быстрое вооружение
      - key: BREAKEVEN_LOCK_FLOOR_PCT
        value: "0.18"      # Покрытие комиссий
      - key: BREAKEVEN_LOCK_HARD_FLOOR_PCT
        value: "-0.10"
      - key: BREAKEVEN_LOCK_COST_BUFFER_PCT
        value: "0.05"
      - key: FAILED_SETUP_EXIT_TREND_ENABLED
        value: "true"

      # Достижимость цели
      # (#tp-reach-censoring-2026-09-04) Вторая оценка достижимости — без наших
      # собственных ранних выходов. Сделка, закрытая защитным выходом ниже цели,
      # доказывает не недостижимость цели, а то, что мы вышли. Считая её
      # промахом, гейт входа учился на решениях контура выхода: 04.09 это дало
      # ETH `0% < 27%` и полный замок. Ужесточить гейт эта оценка не может —
      # путь к ней ведёт только из отказа сырой.
      - key: TP_REACH_CENSOR_ADJUST_ENABLED
        value: "true"
      - key: TP_REACH_MIN_UNCENSORED_SAMPLE
        value: "12"
      # (#tp-reach-shadow-2026-09-06) Отпущен в shadow. Гейт судит по достижению
      # TP2, а сделка платится через TP1 и трейл: замер 04.09 дал +0.98R у
      # дошедшей до TP1 против −0.83R у недошедшей. Он держал 500+ блокировок в
      # сутки при нуле сделок, и проверить его правоту можно только на исходах
      # тех сделок, которые он останавливал. Вердикт продолжает писаться в план
      # (`tp_reach.would_block`) — сравнение делается по нему.
      #
      # Возврат в enforce — после разреза stop-forensics по would_block.
      - key: TP_REACH_MODE
        value: shadow
      - key: TP_REACH_EV_MARGIN
        value: "1.0"
      - key: TP_REACH_MIN_SAMPLE
        value: "15"
      - key: ALLOW_WEAK_VOLUME_TREND_ENTRIES
        value: "false"
      - key: LEARNING_TREND_CONTINUATION_MIN_VOLUME_CONFIRMATION
        value: "8.0"

      # ── CRT ENGINE (Настройка на вход без жестких фильтров) ───────────────
      # CRT часто молчит из-за слишком строгих требований к подтверждению (CISD)
      # и высокому RR. Снижаем планку входа.
      - key: CRT_MIN_RR_TP1
        value: "0.50"      # Допускаем меньший RR для входа
      - key: CRT_MIN_SETUP_SCORE
        value: "45.0"      # Снижен порог качества сетапа
      - key: CRT_REQUIRE_CISD
        value: "false"     # Не требуем жесткого CISD, торгуем по структуре
      - key: CRT_STOP_BUFFER_PCT
        value: "0.08"      # Адекватный буфер стопа
      - key: CRT_TP2_RR
        value: "1.5"       # Цель на продолжение

      # ── SCALP ENGINE (Настройка на частые сделки) ─────────────────────────
      # Scalp не торговал из-за нереалистичных требований к RR и Target %
      - key: SCALP_MIN_NET_RR_TP2
        value: "0.70"      # Снижено с 1.5+ до реалистичного 0.7
      - key: SCALP_TARGET_PCT
        value: "0.40"      # Реалистичная цель скальпа (0.4%)
      - key: SCALP_MIN_SETUP_SCORE
        value: "45.0"      # Порог входа
      - key: SCALP_BREAKEVEN_ARM_PCT
        value: "0.25"      # Быстрый выход в БЗ
      - key: SCALP_TIME_STOP_MIN
        value: "60.0"      # Тайм-стоп 1 час

      # ── RANGE ENGINE (Консервативный) ─────────────────────────────────────
      - key: RANGE_MIN_TP1_NET_PCT
        value: "0.40"
      - key: RANGE_MIN_SETUP_SCORE
        value: "50.0"
      - key: RANGE_ENTRY_RSI_MIN
        value: "30.0"
      - key: RANGE_ENTRY_RSI_MAX
        value: "55.0"
      - key: RANGE_STOP_ATR_MULT
        value: "2.0"

      # ── GRID ENGINE (Защита от слива) ─────────────────────────────────────
      # Grid лил деньги из-за агрессивного плеча и усреднения в сильный тренд.
      # Теперь: меньше маржи, меньше ордеров усреднения, шире шаг.
      - key: GRID_ENABLED
        value: "true"
      - key: GRID_SYMBOLS
        value: BTC/USDT,ETH/USDT
      - key: GRID_KILL_SWITCH_ENABLED
        value: "false"
      - key: GRID_REGIME_EMA_BAND_PCT
        value: "0.70"      # Строгий фильтр флэта (уже 0.8 было)
      - key: GRID_TP_PCT
        value: "0.4"       # Быстрый фикс профита (0.4%)
      - key: GRID_SL_ATR_MULT
        value: "2.0"       # Стоп по волатильности
      - key: GRID_MAX_SAFETY_ORDERS
        value: "2"         # МАКСИМУМ 2 усреднения (было 3)
      - key: GRID_MAX_USED_MARGIN_PCT
        value: "5.0"       # ЛИМИТ МАРЖИ 5% (было 10% - риск!)
      - key: GRID_BREAKOUT_ATR_DIST
        value: "2.0"       # Не открывать если пробой > 2 ATR
      - key: GRID_RANGE_ATR_DIST
        value: "1.2"       # Шаг сетки

      # ── Продукт / подписки ────────────────────────────────────────────────
      - key: VIP_STARS_PRICE_30
        value: "4900"
      - key: VIP_STARS_PRICE_90
        value: "12900"
      - key: VIP_INVITE_LINK
        sync: false
      - key: HTX_AFFILIATE_LINK
        sync: false

      # ── Risk management ───────────────────────────────────────────────────
      - key: RISK_EQUITY_USDT
        value: "950"
      - key: RISK_PER_TRADE_PCT
        value: "0.4"
      - key: LIVE_MAX_ORDER_NOTIONAL_USDT
        value: "250"
      - key: ANTI_DRAIN_MAX_OPEN_POSITIONS
        value: "5"
      - key: MAX_ACTIVE_SIGNALS
        value: "100"
      - key: MAX_TRADES_PER_DAY
        value: "100"       # Разблокировано (было 3)
      - key: MAX_DAILY_LOSS_PCT
        value: "3"
      - key: MAX_DRAWDOWN_PCT
        value: "15"

      # ── Symbol guard ──────────────────────────────────────────────────────
      - key: SYMBOL_PERF_BLOCK_MAX_WINRATE
        value: "48.0"
      - key: SYMBOL_PERF_REDUCE_MAX_WINRATE
        value: "48.0"
      - key: SYMBOL_PERF_COOLDOWN_STREAK
        value: "3"
      - key: SYMBOL_PERF_COOLDOWN_FAILED_SETUPS
        value: "2"
      - key: SYMBOL_PERF_LOOKBACK
        value: "10"

      # ── Production entry gate ─────────────────────────────────────────────
      - key: PROD_GATE_A_PLUS_MIN_SETUP
        value: "76.0"
      - key: PROD_GATE_A_PLUS_MIN_CONFIDENCE
        value: "68.0"
      - key: PROD_GATE_A_PLUS_MIN_RR_TP1_PAPER
        value: "0.10"
      - key: PROD_GATE_A_MIN_SETUP
        value: "65.0"
      - key: PROD_GATE_A_MIN_CONFIDENCE
        value: "62.0"
      - key: PROD_GATE_A_MIN_RR_TP1_PAPER
        value: "0.10"

      # ── Сверка с биржей ───────────────────────────────────────────────────
      - key: EXCHANGE_RECONCILIATION_ENABLED
        value: "false"

      # ── Validation thresholds ─────────────────────────────────────────────
      - key: VALIDATION_MIN_CLOSED_SIGNALS
        value: "50"

      # ── Funding arb ───────────────────────────────────────────────────────
      # (#arb-envelope-to-directional-2026-09-04) Выключен НАМЕРЕННО, не потому
      # что не работал: 5 закрытых хеджей, реализовано +4.02 USDT. Решение —
      # отдать его конверт капитала (CAPITAL_ENVELOPE_ARB_PCT = 20% эквити)
      # направленным движкам, которые умеют занять деньги немедленно и по
      # качеству сетапа, а не по расписанию фандинга.
      #
      # Значение правилось в дашборде Render, но блупринт объявлял "true" —
      # следующий sync blueprint молча включил бы арбитраж обратно и увёл 20%
      # у направленных. Поэтому источник правды приведён в соответствие здесь.
      # Миграция доли автоматическая (services/capital_envelopes.effective_shares),
      # но с условием: доля уходит, только если контур выключен И НЕ ДЕРЖИТ
      # позиций. При открытых хеджах доля за ним сохраняется.
      - key: ENABLE_FUNDING_ARB
        value: "false"
      - key: ENABLE_FUTURES
        value: "true"
      - key: FUNDING_ARB_SYMBOLS
        value: BTC/USDT,ETH/USDT,SOL/USDT,DOGE/USDT,XRP/USDT,SUI/USDT
      - key: FUNDING_ARB_AUTO_OPEN_PAPER
        value: "true"

      # ── Межбиржевой арбитраж: ТОРГОВЛЯ ВЫКЛЮЧЕНА ──────────────────────────
      # 14 закрытых, −1.25 USDT, ВСЕ по `spread_flipped`: спред схлопывается
      # раньше, чем carry покроет 0.2% комиссий. Причина структурная — REST
      # через ccxt отстаёт от колокации, возможность видна уже мёртвой.
      # Настройками не лечится, поэтому флаг, а не подбор порогов.
      # Снятие спреда продолжает работать (проверка качества фида HTX) —
      # выключено только ОТКРЫТИЕ позиций. Возврат — при смене тарифа
      # (комиссии ~0.04% круг) или быстром канале данных.
      - key: CROSS_FARB_ENABLED
        value: "false"

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  - type: web
    name: robot-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true

    envVars:
      - key: API_BASE_URL
        value: https://robot-api-1rgi.onrender.com
      - key: OWNER_API_TOKEN
        sync: false
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false

  # ── Redis (Render Key Value) ────────────────────────────────────────────────
  - type: keyvalue
    name: robot-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ── Daily owner report ──────────────────────────────────────────────────────
  - type: cron
    name: robot-daily-report
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: starter
    region: singapore
    branch: main
    schedule: "0 3 * * *"
    dockerCommand: python send_daily_report.py
    envVars:
      - key: OWNER_API_TOKEN
        sync: false
      - key: REPORT_API_URL
        value: https://robot-api-1rgi.onrender.com

databases:
  - name: robot-db
    plan: basic-256mb
    databaseName: robot
    user: robot
    region: singapore